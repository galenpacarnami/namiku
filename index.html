    <style>
        :root {
            --hot-pink: #FF69B4;

            --bg-gradient: radial-gradient(circle at top center, #fff0f5, #ffdae9);

        }

        * {

        body {

        }

</head>
<body>

    <div class="bg-decor" id="bgDecor"></div>

    <audio id="bgm">
        <source src="our-song.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle" onclick="toggleMusic()" aria-label="Play Music">🎵</button>

    <div id="screen-welcome" class="screen active">
        <div class="gift-box">🎁</div>
        <div class="decor-line">✦ ✦ ✦</div>
        <h1 class="title">Happy Birthday, Nami 🎀</h1>
        <p class="subtitle">To the one who makes every moment magical.</p>
        <button class="btn-main" onclick="goToLetter()">Open Your Birthday Letter 💌</button>
    </div>

    <div id="screen-letter" class="screen">
        <div class="card-container">
            <div class="card-header">My Bebe,</div>
            <div class="letter-text">
                <span id="typewriter-content"></span><span class="cursor"></span>
            </div>
            <div id="gratitude-msg" class="gratitude-line">
                Forever grateful for every moment with you ✨
            </div>
            <button id="continue-btn" class="btn-small" style="display:none;" onclick="goToFinal()">Continue 💗</button>
        </div>
    </div>

    <div id="screen-final" class="screen">
        <div class="heart-pink">💗</div>
        <h2 class="title" style="font-size: 2.5rem;">Once again...</h2>
        <p class="final-text">
            Happy Birthday, Bebe.<br>
            I love you endlessly. 💗
        </p>
    </div>

    <script>
        const bgDecor = document.getElementById('bgDecor');
        const shapes = ['💗', '✨', '⭐', '💖', '🎀'];
        
        function createFloatingShape() {
            const el = document.createElement('div');
            el.classList.add('floating-shape');
            el.innerText = shapes[Math.floor(Math.random() * shapes.length)];
            el.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 10 + 10;
            el.style.animationDuration = duration + 's';
            bgDecor.appendChild(el);
            setTimeout(() => { el.remove(); }, duration * 1000);
        }

        setInterval(createFloatingShape, 2000);
        createFloatingShape();

        const welcomeScreen = document.getElementById('screen-welcome');
        const letterScreen = document.getElementById('screen-letter');
        const finalScreen = document.getElementById('screen-final');

        const letterText = `If I could choose any place or any role in this world, I would choose this, right here, as your boyfriend. Aku bersyukur banget bisa ada di posisiku yang sekarang, nemenin bebee.\n\nDi hari spesial bebee ini, aku mau minta maaf ya kalau semisal selama ini masih banyak kurangnya. Maaf kalau aku masih sering bikin bebe sedih karena belum bisa selalu bikin bebe seneng atau selalu happy. Dan maaf klo semisal ada kata-kata aku yang pernah buat bebe sedih atau kecewa. Aku bakal terus belajar buat jadi yang terbaik buat bebee.\n\nBut if there is one thing bebe should know is that I love you so much more than anything in this world. And in any situation, I would keep you as my priorities.\n\nBebe jangan ovt-ovt ya, bebe inget aku sekarang lagi berada di posisi yg aku selalu inginkan dari semester 2 lalu (which is, standing here as your boyfriend) dan gamungkin aku mau (atau bahkan BISA) ngelepas ini.\n\nlafyaw bebe <3`;

        let isTyping = false;
        let currentText = '';

        function goToLetter() {
            welcomeScreen.classList.remove('active');
            letterScreen.classList.add('active');
            
            if (!isTyping && currentText.length === 0) {
                typeWriter();
            }
        }

        function typeWriter() {
            isTyping = true;
            const contentEl = document.getElementById('typewriter-content');
            let index = 0;
            
            function type() {
                if (index < letterText.length) {
                    currentText += letterText.charAt(index);
                    
                    if (letterText.charAt(index) === '\n') {
                        contentEl.innerHTML += '<br>';
                    } else {
                        contentEl.innerHTML += letterText.charAt(index);
                    }
                    
                    index++;
                    setTimeout(type, Math.random() * 30 + 20);
                } else {
                    document.getElementById('continue-btn').style.display = 'inline-block';
                }
            }
            type();
        }

        function goToFinal() {
            letterScreen.classList.remove('active');
            finalScreen.classList.add('active');
        }

        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicToggle');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgm.pause();
                musicBtn.innerHTML = '🎵';
                musicBtn.style.background = 'white';
                musicBtn.style.color = '#FF69B4';
            } else {
                bgm.play().catch(e => console.log('Please add your audio file "our-song.mp3" to play music'));
                musicBtn.innerHTML = '⏸';
                musicBtn.style.background = '#FF69B4';
                musicBtn.style.color = 'white';
            }
            isPlaying = !isPlaying;
        }

    </script>
</body>
</html>
